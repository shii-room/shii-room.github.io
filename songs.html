<style>

    --wrap: min(1040px, 100% - 40px);

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    color: var(--ink);
    font-family: var(--sans);

  a:focus-visible, summary:focus-visible, button:focus-visible { outline: 2px solid var(--rose); outline-offset: 4px; border-radius: 4px; }
  .heart { display: inline-block; width: .38em; height: .38em; vertical-align: top; color: var(--rose); }

  /* Header */
  .header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: rgba(246,228,233,.8);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .header__in { width: var(--wrap); margin-inline: auto; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--maru); font-weight: 700; font-size: 17px; letter-spacing: .08em; color: var(--ink); }
  .logo img { width: 34px; height: 34px; }
  .nav { display: flex; gap: clamp(14px, 3.4vw, 32px); font-family: var(--en); font-weight: 500; font-size: 12px; letter-spacing: .18em; color: var(--ink-sub); }
  .nav a { transition: color .2s; }
  .nav a:hover { color: var(--rose); }

  .menu-btn {
    display: inline-flex; flex-direction: column; justify-content: center; gap: 6px;
    width: 44px; height: 44px; margin-right: -10px; padding: 0 10px;
    background: none; border: 0; cursor: pointer; color: var(--rose);
  }
  .menu-btn span { display: block; height: 1.5px; background: currentColor; border-radius: 1px; transition: transform .2s, opacity .2s; }
  .menu-btn span:nth-child(2) { width: 70%; margin-left: auto; }
  .menu-btn[aria-expanded="true"] span:nth-child(1) { transform: translateY(3.75px) rotate(45deg); }
  .menu-btn[aria-expanded="true"] span:nth-child(2) { width: 100%; transform: translateY(-3.75px) rotate(-45deg); }
  .header__right { display: flex; align-items: center; gap: 28px; }
  .header .nav { display: none; }

  .menu {
    position: fixed; inset: calc(env(safe-area-inset-top, 0px) + 57px) 0 0 0; z-index: 9;
    background: linear-gradient(180deg, rgba(246,228,233,.97), rgba(226,185,198,.97));
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px);
    opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s;
  }
  .menu.is-open { opacity: 1; visibility: visible; }
  .menu__in { width: var(--wrap); margin-inline: auto; padding-block: 32px 48px; }
  .menu__label { margin: 4px 0 10px; font-family: var(--en); font-weight: 500; font-size: 12px; letter-spacing: .3em; color: var(--rose-deep); }
  .menu__label + .quick { margin-top: 0; }
  .quick--menu { max-width: none; margin-bottom: 28px; }
  .menu__sns { list-style: none; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }

  /* Hero */

  .hero__photo { position: relative; justify-self: center; width: min(100%, 420px); }
  .hero__photo .holo { border-radius: 16px; border: 6px solid var(--white); box-shadow: 8px 8px 0 var(--rose); }
  .bubble {
    position: absolute; right: -4%; top: -14px; z-index: 2;
    padding: 12px 16px; border-radius: 50%;
    background: var(--white); color: var(--rose);
    font-family: var(--hand); font-size: clamp(15px, 4vw, 18px); line-height: 1.4; text-align: center;
    transform: rotate(8deg);
    box-shadow: 0 4px 14px rgba(150,70,95,.15);
  }

  @keyframes pyoko {
    0%, 40%, 100% { transform: translateY(0) rotate(8deg) scale(1); }
    8%  { transform: translateY(-10px) rotate(3deg) scale(1.05); }
    16% { transform: translateY(0) rotate(11deg) scale(.98); }
    22% { transform: translateY(-5px) rotate(6deg) scale(1.02); }
    30% { transform: translateY(0) rotate(8deg) scale(1); }
  }
  .hero__photo .floater { animation: fuwa 5s ease-in-out infinite; }
  .hero__photo .holo { animation: fuwa-sh 5s ease-in-out infinite; }
  @keyframes fuwa { 0%, 100% { transform: translateY(0) rotate(-.5deg); } 50% { transform: translateY(-14px) rotate(.9deg); } }
  @keyframes fuwa-sh { 0%, 100% { box-shadow: 8px 8px 0 var(--rose); } 50% { box-shadow: 10px 16px 0 rgba(224,116,150,.75); } }
  .hero__name .heart { transform-origin: 50% 60%; animation: dokidoki 1.4s ease-in-out infinite; }
  @keyframes dokidoki { 0%, 40%, 100% { transform: scale(1); } 10% { transform: scale(1.3); } 20% { transform: scale(.95); } 30% { transform: scale(1.18); } }
  .floaty { position: absolute; z-index: 3; pointer-events: none; color: var(--rose); opacity: 0; animation: floaty 4s ease-in infinite; }
  .floaty svg { display: block; width: 100%; height: 100%; }
  .floaty--w { color: var(--white); filter: drop-shadow(0 1px 3px rgba(224,116,150,.6)); }
  .floaty.f1 { left: 3%;  bottom: 22%; width: 28px; height: 26px; animation-delay: .2s; }
  .floaty.f2 { left: 14%;  bottom: 8%;  width: 20px; height: 18px; animation-delay: 1.6s; }
  .floaty.f3 { right: 4%; bottom: 30%; width: 24px; height: 22px; animation-delay: 2.6s; }
  .floaty.f4 { right: 14%; bottom: 6%;  width: 32px; height: 29px; animation-delay: 3.3s; }
  .floaty.f5 { left: 46%;  bottom: 2%; width: 22px; height: 20px; animation-delay: 1s; }
  @keyframes floaty {
    0%   { opacity: 0; transform: translate(0, 0) rotate(-10deg) scale(.6); }
    15%  { opacity: 1; }
    50%  { transform: translate(10px, -90px) rotate(10deg) scale(1); }
    80%  { opacity: .9; }
    100% { opacity: 0; transform: translate(-6px, -180px) rotate(-8deg) scale(.8); }

  }
  /* ふだんは光らない。タップした時だけキラッ */
  .tilt.is-flash .holo::before { opacity: .5; animation: holo-flow 1.6s ease-out forwards; }
  .tilt.is-flash .holo::after  { opacity: .9; animation: holo-glare 1.2s ease-in-out forwards; }
  @keyframes holo-flow { 0% { background-position: 0% 50%; } 100% { background-position: 60% 50%; } }
  @keyframes holo-glare { 0% { background-position: 130% 0, 0 0; } 100% { background-position: -30% 0, 0 0; } }
  .tilt.is-touch .holo::before { animation: none; background-position: var(--hx, 50%) var(--hy, 50%); opacity: .65; }
  .tilt.is-touch .holo::after { animation: none; opacity: .9; background-position: var(--gx, 50%) 0, var(--lx, 0px) var(--ly, 0px); }
  /* サイン：タップした時だけピンクゴールドにキラッ */
  .sig { position: absolute; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .4s ease;
    filter: drop-shadow(0 0 1.5px rgba(255,226,160,.95)) drop-shadow(0 0 6px rgba(255,150,195,.85)); }
  .sig__ink { position: absolute; inset: 0;
    -webkit-mask: url(img/sig.webp) 0 0 / 100% 100% no-repeat; mask: url(img/sig.webp) 0 0 / 100% 100% no-repeat;
    background: linear-gradient(110deg, #ff7fb5 0%, #ffc2dc 16%, #e6ad4a 30%, #fff3c8 40%, #f0bf5c 50%, #ff98c6 66%, #ffd9ea 80%, #e6ad4a 100%);
    background-size: 260% 100%; background-position: 100% 0; }
  .sig__star { position: absolute; width: 16%; aspect-ratio: 1; color: #fff6d6; opacity: 0; transform: scale(.2) rotate(0); }
  .sig__star { right: 2%; top: -4%; }
  .sig__star.s2 { left: 4%; top: 30%; width: 10%; }
  .tilt.is-touch .sig, .tilt.is-flash .sig { opacity: 1; }
  .tilt.is-touch .sig__ink, .tilt.is-flash .sig__ink { animation: sig-shine 1.3s ease-in-out infinite alternate; }
  .tilt.is-touch .sig__star, .tilt.is-flash .sig__star { animation: sig-star 1.1s ease-in-out infinite; }
  .tilt.is-touch .sig__star.s2, .tilt.is-flash .sig__star.s2 { animation-delay: .5s; }
  @keyframes sig-shine { from { background-position: 100% 0; } to { background-position: 0% 0; } }
  @keyframes sig-star { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }
  .bubble { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .bubble__t { display: inline-block; }
  .bubble__t.is-swap { animation: bubble-swap .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bubble-swap { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .bubble::after { content: ""; position: absolute; left: 6px; bottom: 4px; width: 16px; height: 16px; background: var(--white); clip-path: polygon(100% 0, 0 100%, 60% 30%); }
  .hero__en { font-family: var(--en); font-weight: 500; font-size: 12px; letter-spacing: .4em; color: var(--ink-sub); }
  .hero__welcome { margin-top: 10px; font-family: var(--hand); font-size: clamp(18px, 5vw, 22px); letter-spacing: .08em; color: var(--ink-sub); }
  .hero__name {
    margin-top: 4px;
    font-family: var(--maru); font-weight: 700; font-size: clamp(72px, 20vw, 120px); line-height: 1.05; letter-spacing: .04em;
    color: var(--white);
    -webkit-text-stroke: 2px var(--rose);
    paint-order: stroke fill;
    text-shadow: 5px 5px 0 var(--rose);
  }
  .hero__name .heart { width: .3em; height: .3em; margin-left: .08em; }
  .hero__logo { margin: 6px 0 0 -8px; line-height: 0; }
  .hero__logo img { display: block; width: min(100%, 400px); height: auto; transform-origin: 50% 90%; animation: puni 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(150,70,95,.15)); }
  @keyframes puni {
    0%, 70%, 100% { transform: translateY(0) scale(1, 1); }
    78% { transform: translateY(0) scale(1.03, .96); }
    86% { transform: translateY(-6px) scale(.98, 1.03); }
    93% { transform: translateY(0) scale(1.02, .98); }
  }
  html.op-in .hero__logo img { animation: logo-pop .8s cubic-bezier(.3,1.6,.5,1) .35s both, puni 3.2s ease-in-out 1.2s infinite; }
  @keyframes logo-pop { 0% { opacity: 0; transform: scale(.6) rotate(-6deg); } 100% { opacity: 1; transform: none; } }
  .hero__tag { display: inline-block; margin-top: 18px; padding: 4px 14px; border-radius: 999px; background: var(--white); font-family: var(--maru); font-weight: 700; font-size: 13px; letter-spacing: .1em; color: var(--rose-deep); }
  .hero__talk { margin-top: 18px; font-size: 15px; line-height: 2; letter-spacing: .06em; }
  .hero__talk b { font-family: var(--maru); font-weight: 700; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 28px; min-width: 188px; height: 52px; padding-inline: 30px;
    background: var(--white); color: var(--ink);
    border: 1.5px solid var(--rose); border-radius: 999px;
    box-shadow: 4px 4px 0 var(--rose);
    font-family: var(--maru); font-weight: 700; font-size: 15px; letter-spacing: .12em;
    transition: transform .15s, box-shadow .15s, background-color .15s, color .15s;
  }
  .btn:hover { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--rose); background: var(--rose); color: var(--white); }
  .btn--main { background: var(--rose); color: var(--white); border-color: var(--white); box-shadow: 4px 4px 0 var(--white); }
  .btn--main:hover { background: var(--white); color: var(--ink); box-shadow: 1px 1px 0 var(--white); }
  .hero__btns { display: flex; flex-wrap: wrap; gap: 0 18px; }
  /* ヒーロー下のコンパクトなメニュー（3列×2段） */
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 26px; max-width: 420px; }
  .quick a {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    min-height: 84px; padding: 11px 4px 10px; border-radius: 18px;
    background: linear-gradient(145deg, #FFFCFD, #FBEAF0); border: 1.5px solid var(--white); box-shadow: 0 4px 0 #E6A6BE, 0 7px 12px rgba(174,92,120,.08);
    font-family: var(--maru); font-weight: 700; font-size: 14px; letter-spacing: .02em; color: var(--ink); text-align: center;
    transition: transform .15s, box-shadow .15s, background-color .15s; -webkit-tap-highlight-color: transparent;
  }
  .quick a:hover, .quick a:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(224,116,150,.45); background: var(--white); }
  .quick a::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(255,255,255,.9); border-radius: 12px; pointer-events: none; }
  .quick a::after { content: "♡"; position: absolute; top: 7px; right: 10px; font-size: 12px; line-height: 1; color: var(--rose); opacity: .5; pointer-events: none; }
  .quick a.quick__omikuji::after { color: #916DB0; }
  .quick { grid-template-columns: repeat(6, 1fr); }
  .quick a { grid-column: span 2; }
  .quick a.quick__half { grid-column: span 3; flex-direction: row; gap: 8px; min-height: 54px; font-size: 13px;
    background: linear-gradient(90deg, rgba(255,255,255,.85), rgba(255,236,242,.9)); }
  .quick a.quick__omikuji { grid-column: 1 / -1; flex-direction: row; gap: 10px; min-height: 58px; font-size: 14px; background: linear-gradient(110deg, #F7F2FC, #EEE4F7); border-color: #D5C1E8; box-shadow: 0 3px 0 #C2A8DC; color: #765591; }
  .quick a.quick__omikuji:hover, .quick a.quick__omikuji:active { background: #F7F2FC; box-shadow: 0 1px 0 #C2A8DC; }
  .quick__omikuji .quick__i { background: #E6D7F1; color: #916DB0; }
  .quick__wide small { font-family: var(--maru); font-weight: 500; font-size: 11px; color: var(--ink-sub); padding: 2px 8px; border-radius: 999px; background: #FBE3EA; }
  .quick__i { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(145deg, #FDE9F0, #F5CADB); color: var(--rose); box-shadow: inset 0 1px 0 #fff, 0 0 0 3px rgba(255,255,255,.65); }
  .quick__i svg { width: 22px; height: 22px; }
  .quick a:nth-child(2) .quick__i svg, .quick a:nth-child(5) .quick__i svg { width: 20px; height: 20px; }

  /* セクション共通 */
  .sec { width: var(--wrap); margin-inline: auto; padding-block: 72px; border-top: 1px dashed var(--white); }
  .sec__head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 32px; }
  .sec__en { font-family: var(--en); font-weight: 500; font-size: clamp(34px, 8vw, 52px); letter-spacing: .08em; line-height: 1; color: var(--rose); }
  .sec__ja { font-family: var(--maru); font-weight: 500; font-size: 13px; letter-spacing: .14em; color: var(--ink-sub); }

  /* PROFILE */
  .prof { display: grid; gap: 28px; }
  .prof__id { display: flex; align-items: center; gap: 18px; }
  .prof__icon { flex: none; width: 104px; height: 104px; }
  /* アイコン＝缶バッジ：ときどきツヤが走り、タップでクルッと裏返って1周年の記念面に */
  .badge { position: relative; flex: none; width: 104px; height: 104px; padding: 0; border: 0; background: none; border-radius: 50%; cursor: pointer; perspective: 600px; -webkit-tap-highlight-color: transparent; }
  .badge__in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.35,1.4,.5,1); }
  .badge.is-flip .badge__in { transform: rotateY(180deg); }
  .badge__f, .badge__b { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: 0 4px 10px rgba(150,70,95,.25); }
  .badge__f img { display: block; width: 100%; height: 100%; }
  .badge__f::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.75) 48%, transparent 60%) no-repeat; background-size: 260% 100%; background-position: 140% 0;
    animation: badge-gloss 5s ease-in-out infinite; }
  @keyframes badge-gloss { 0%, 70% { background-position: 140% 0; } 90%, 100% { background-position: -40% 0; } }
  .badge__b { transform: rotateY(180deg);
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.95) 0, rgba(255,255,255,0) 45%),
      conic-gradient(from 200deg, #F7B7CC, #F3C9E6, #E9C8F5, #F9D9C2, #F7B7CC, #F2A9C4, #F7B7CC);
    border: 3px solid var(--white); }
  .badge__b svg { display: block; width: 100%; height: 100%; }
  .badge__b .bg-ring { font-family: var(--en); font-weight: 500; font-size: 15px; fill: #C9557B; }
  .badge__b .bg-1st { font-family: "Great Vibes", "Snell Roundhand", cursive; font-size: 58px; stroke: #fff; stroke-width: 2.4px; paint-order: stroke fill; filter: drop-shadow(0 2px 3px rgba(180,80,120,.35)); }
  .badge__b .bg-ann { font-family: var(--en); font-weight: 500; font-size: 12.5px; letter-spacing: 1.6px; fill: #C9557B; }
  .badge__b::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.7) 48%, transparent 60%) no-repeat; background-size: 260% 100%; background-position: 140% 0; }
  .badge.is-flip .badge__b::after { animation: badge-shine 1.2s ease-in-out .45s both; }
  @keyframes badge-shine { from { background-position: 140% 0; } to { background-position: -40% 0; } }
  .badge-spark { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; color: #FFD27A; pointer-events: none; z-index: 2; opacity: 0;
    filter: drop-shadow(0 0 3px rgba(255,200,120,.9)); animation: badge-spark .9s ease-out both; }
  .badge-spark svg { display: block; width: 100%; height: 100%; }
  @keyframes badge-spark { 0% { opacity: 0; transform: rotate(var(--a)) translateY(0) scale(.3); } 30% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-74px) scale(1) rotate(180deg); } }
  .prof__name { font-family: var(--maru); font-weight: 700; font-size: 26px; letter-spacing: .08em; }
  .prof__aff { font-family: var(--maru); font-weight: 500; font-size: 13px; letter-spacing: .1em; color: var(--ink-sub); }
  .prof__text { margin-top: 18px; font-size: 16px; letter-spacing: .05em; }
  .prof__side { display: flex; align-items: flex-end; gap: 20px; }
  .prof__meta { display: grid; gap: 8px; font-size: 14px; flex: 1; }
  .prof__meta div { display: flex; gap: 16px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .prof__meta dt { width: 2.6em; font-family: var(--en); font-weight: 500; font-size: 13px; letter-spacing: .12em; color: var(--rose-deep); }
  .prof__meta dd { margin: 0; font-family: var(--maru); font-weight: 700; letter-spacing: .06em; }
  .prof__chibi { flex: none; width: 110px; height: auto; filter: drop-shadow(0 6px 12px rgba(150,70,95,.2)); }
  .prof__buddy { position: relative; flex: none; padding: 0 0 6px; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .prof__buddy::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 0; height: 10px; border-radius: 50%; background: rgba(150,70,95,.18); filter: blur(2px); }
  .buddy__bob { display: block; position: relative; z-index: 1; transform-origin: 50% 100%; perspective: 700px; animation: buddy-idle 6s ease-in-out infinite; }
  /* ゆらゆら → ぴょんぴょん（その間だけ「><」の笑顔） */
  @keyframes buddy-idle {
    0%, 100% { transform: rotate(-3deg) translateY(0) scale(1,1); }
    15% { transform: rotate(3deg) translateY(-2px) scale(1,1); }
    30% { transform: rotate(-3deg) translateY(0) scale(1,1); }
    45% { transform: rotate(3deg) translateY(-2px) scale(1,1); }
    60% { transform: rotate(0) translateY(0) scale(1,1); }
    66% { transform: rotate(0) translateY(0) scale(1.06,.93); }
    72% { transform: rotate(-2deg) translateY(-14px) scale(.97,1.04); }
    78% { transform: rotate(0) translateY(0) scale(1.06,.93); }
    84% { transform: rotate(2deg) translateY(-9px) scale(.98,1.03); }
    90% { transform: rotate(0) translateY(0) scale(1.03,.97); }
    95% { transform: rotate(-2deg) translateY(0) scale(1,1); }
  }
  .buddy__smile { position: absolute; left: 0; top: 0; display: block; width: 102px; height: auto; -webkit-backface-visibility: hidden; backface-visibility: hidden; opacity: 0; animation: buddy-smile 6s linear infinite; pointer-events: none; }
  @keyframes buddy-smile { 0%, 64% { opacity: 0; } 66%, 91% { opacity: 1; } 93%, 100% { opacity: 0; } }
  .prof__buddy.is-flip .buddy__smile { animation: none; opacity: 0; }
  .buddy__flip { display: block; position: relative; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.35,1.45,.5,1); }
  .prof__buddy.is-flip .buddy__flip { transform: rotateY(180deg); }
  .buddy__f, .buddy__b { display: block; width: 102px; height: auto; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .buddy__b { position: absolute; left: 0; top: 0; transform: rotateY(180deg); }
  .prof__buddy.is-flip .buddy__bob { animation: hop .7s cubic-bezier(.3,.6,.4,1), happy .5s ease-in-out .65s 3; }
  /* うれしくて左右にふりふり */
  @keyframes happy {
    0%, 100% { transform: rotate(0) translateY(0) scale(1, 1); }
    25% { transform: rotate(-9deg) translateY(-5px) scale(1.03, .97); }
    50% { transform: rotate(0) translateY(0) scale(1, 1); }
    75% { transform: rotate(9deg) translateY(-5px) scale(1.03, .97); }
  }
  @keyframes hop { 0% { transform: translateY(0) scale(1.06,.92); } 40% { transform: translateY(-22px) scale(.97,1.04); } 80% { transform: translateY(0) scale(1.05,.94); } 100% { transform: none; } }
  .pop-heart { position: absolute; z-index: 2; left: 50%; top: 4%; width: 26px; height: 24px; margin-left: -13px; color: var(--rose); pointer-events: none; opacity: 0; animation: popheart .9s ease-out both; }
  .pop-heart svg { display: block; width: 100%; height: 100%; }
  @keyframes popheart { 0% { opacity: 0; transform: translate(0,0) scale(.3); } 25% { opacity: 1; transform: translate(var(--dx), -20px) scale(1.1); } 100% { opacity: 0; transform: translate(calc(var(--dx) * 2), -80px) scale(.8); } }
  @media (min-width: 768px) { .prof { grid-template-columns: 1fr 1fr; gap: 0 64px; align-items: end; } }

  /* SCHEDULE */
  .sched__row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
  .sched__time { font-family: var(--en); font-weight: 500; font-size: clamp(40px, 10vw, 56px); letter-spacing: .04em; line-height: 1.1; color: var(--ink); }
  .sched__freq { font-family: var(--maru); font-weight: 700; font-size: 17px; letter-spacing: .1em; color: var(--rose-deep); }
  .sched__note { margin-top: 10px; font-size: 14px; line-height: 2; letter-spacing: .05em; }
  .sched__note a { font-family: var(--maru); font-weight: 700; border-bottom: 1.5px solid var(--rose); }
  .sched__note a:hover { color: var(--rose-deep); }
  .acts { list-style: none; margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
  .acts li { padding: 8px 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--white); font-family: var(--maru); font-weight: 700; font-size: 14px; letter-spacing: .06em; }

  .xfeed { margin-top: 40px; max-width: 560px; }
  .xfeed__label { font-family: var(--maru); font-weight: 700; font-size: 14px; letter-spacing: .1em; margin-bottom: 12px; color: var(--rose-deep); }
  .xfeed__list { display: grid; gap: 4px; }
  .xfeed__list .twitter-tweet { margin: 0 !important; }
  .xfeed__item { min-height: 40px; }
  .xfeed__more { display: inline-block; margin-top: 12px; font-size: 12px; letter-spacing: .06em; color: var(--ink-sub); transition: color .2s; }
  .xfeed__more:hover { color: var(--rose-deep); }
  [hidden] { display: none !important; }

  /* REQUEST */
  .req { max-width: 560px; }
  .req__pic { position: relative; margin: 0 0 22px; }
  /* 歌のイラストをタップ → ライブの紙吹雪 */
  .confetti { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 6; pointer-events: none; }
  .confetti i { position: absolute; left: 0; top: 0; display: block; will-change: transform, opacity; backface-visibility: visible; }
  .confetti i.rect { width: 7px; height: 11px; border-radius: 1.5px; }
  .confetti i.strip { width: 4px; height: 15px; border-radius: 2px; }
  .confetti i.dot { width: 7px; height: 7px; border-radius: 50%; }
  .confetti i svg { display: block; width: 13px; height: 13px; }
  .req__pic .holo { border-radius: 16px; border: 5px solid var(--white); box-shadow: 6px 6px 0 var(--rose); }
  .req__pic .floater { animation: fuwa-s 5.5s ease-in-out infinite; }
  @keyframes fuwa-s { 0%, 100% { transform: translateY(0) rotate(.4deg); } 50% { transform: translateY(-7px) rotate(-.5deg); } }
  .req__lead { font-size: 15px; line-height: 2; letter-spacing: .05em; }
  .req__form { margin-top: 26px; display: grid; gap: 18px; }
  .req__row { display: grid; gap: 18px; }
  .req__f label { display: block; font-family: var(--maru); font-weight: 700; font-size: 13px; letter-spacing: .1em; margin-bottom: 6px; }
  .req__f label small { font-family: var(--sans); font-weight: 400; font-size: 11px; color: var(--ink-sub); margin-left: 6px; letter-spacing: .06em; }
  .req__f input, .req__f textarea {
    display: block; width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--white); border-radius: 12px; background: rgba(255,255,255,.7);
    font: inherit; font-size: 16px; line-height: 1.6; color: var(--ink); -webkit-appearance: none; appearance: none;
    transition: border-color .15s, background-color .15s;
  }
  .req__f textarea { min-height: 92px; resize: vertical; }
  .req__f input::placeholder, .req__f textarea::placeholder { color: rgba(142,92,105,.6); }
  .req__f input:focus, .req__f textarea:focus { outline: none; border-color: var(--rose); background: var(--white); }
  .req__hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .req .btn { margin-top: 6px; cursor: pointer; justify-self: start; }
  .req .btn:disabled { opacity: .55; cursor: default; transform: none; }
  .req__msg { min-height: 1.8em; font-family: var(--maru); font-weight: 700; font-size: 14px; letter-spacing: .06em; }
  .req__msg.err { color: #B3264A; }
  .req__done, .req__closed { margin-top: 26px; padding: 26px 24px; border-radius: 16px; background: var(--glass); border: 1px solid var(--white); }
  .req__done p:first-child, .req__closed p:first-child { font-family: var(--maru); font-weight: 700; font-size: 18px; letter-spacing: .08em; }
  .req__done p + p, .req__closed p + p { margin-top: 6px; font-size: 14px; color: var(--ink-sub); }
  .req__again { margin-top: 14px; background: none; border: 0; padding: 0; font: inherit; font-size: 13px; letter-spacing: .08em; color: var(--ink); border-bottom: 1.5px solid var(--rose); cursor: pointer; }
  @media (min-width: 768px) { .req__row { grid-template-columns: 1fr 1fr; } }

  .acc__btn {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; max-width: 560px; margin-top: 22px; padding: 16px 22px;
    background: var(--white); color: var(--ink); border: 1.5px solid var(--rose); border-radius: 999px;
    box-shadow: 4px 4px 0 var(--rose); cursor: pointer;
    font-family: var(--maru); font-weight: 700; font-size: 15px; letter-spacing: .1em; text-align: left;
    transition: transform .15s, box-shadow .15s;
  }
  .acc__btn:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--rose); }
  .acc__mark { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--rose); position: relative; transition: transform .25s; }
  .acc__mark::before, .acc__mark::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 2px; margin: -1px 0 0 -6px; background: var(--white); border-radius: 1px; }
  .acc__mark::after { transform: rotate(90deg); transition: transform .25s; }
  .acc__btn[aria-expanded="true"] .acc__mark::after { transform: rotate(0deg); }
  .acc__panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .acc__panel > div { overflow: hidden; }
  .acc__panel.is-open { grid-template-rows: 1fr; }
  .acc__panel.is-open > div { overflow: visible; }

  /* MESSAGE：匿名メッセージ */
  .mbox { max-width: 560px; }
  .mbox__card { position: relative; margin: 22px 8px 0 0; padding: 20px 20px 16px; border-radius: 20px; background: var(--white); box-shadow: 6px 6px 0 var(--rose); }
  .mbox__card textarea { display: block; width: 100%; min-height: 150px; border: 0; resize: vertical; background: transparent; font: inherit; font-size: 16px; line-height: 1.8; color: var(--ink); -webkit-appearance: none; appearance: none; }
  .mbox__card textarea:focus { outline: none; }
  .mbox__card textarea::placeholder { color: rgba(142,92,105,.55); }
  .mbox__count { text-align: right; font-family: var(--en); font-weight: 500; font-size: 12px; color: var(--ink-sub); }
  .mbox__count.over { color: #B3264A; }
  .mbox__note { margin-top: 14px; font-size: 12px; letter-spacing: .04em; color: var(--ink-sub); }
  .mbox .btn { cursor: pointer; }
  .mbox .btn:disabled { opacity: .55; cursor: default; transform: none; }

  /* 動くフレーム（リクエスト：音符／メッセージ：ハートと手紙） */
  .deco { position: relative; padding: 48px 20px 24px; border-radius: 26px; background: rgba(255,255,255,.28); border: 2px dashed rgba(255,255,255,.95); }
  /* いちごミルクのアイシング：枠の上にとろっとかかって、カラースプレー付き。たまに一滴たれる */
  .deco::before { content: ""; position: absolute; left: -2px; right: -2px; top: -2px; height: 50px; z-index: 0; pointer-events: none;
    border-radius: 26px 26px 0 0; background: 0 0 / 360px 50px repeat-x;
    filter: drop-shadow(0 2px 1.5px rgba(220,90,140,.18)); }
  .deco::after { content: ""; position: absolute; z-index: 0; pointer-events: none; width: 8px; height: 10px;
    border-radius: 50% 50% 50% 50% / 38% 38% 62% 62%;
    background: radial-gradient(circle at 62% 62%, #fff 0 1.1px, transparent 1.6px), linear-gradient(#FC9BBC, #F585AC);
    transform-origin: 50% 0; transform: scale(0); opacity: 0;
    animation: sauce-drop 10s ease-in infinite; }
  @keyframes sauce-drop {
    0%, 72% { transform: translateY(-5px) scale(0); opacity: 0; }
    77% { transform: translateY(-4px) scale(.55, .5); opacity: 1; }
    85% { transform: translateY(-1px) scale(.9, 1.15); opacity: 1; }
    88% { transform: translateY(0) scale(1, 1.2); opacity: 1; }
    98%, 100% { transform: translateY(54px) scale(.85, 1); opacity: 0; }
  }
  .deco--sweets::before { background-image: url(img/drip0.svg); background-position: 0px 0; }
  .deco--sweets::after { left: calc(158.1px - 2px - 4px); top: calc(30.5px - 2px - 6px); animation-delay: 0.0s; }
  .deco--night::before { background-image: url(img/drip1.svg); background-position: -60px 0; }
  .deco--night::after { left: calc(179.9px - 2px - 4px); top: calc(26.1px - 2px - 6px); animation-delay: 1.6s; }
  .deco--music::before { background-image: url(img/drip2.svg); background-position: -20px 0; }
  .deco--music::after { left: calc(119.1px - 2px - 4px); top: calc(30.7px - 2px - 6px); animation-delay: 3.2s; }
  .deco--love::before { background-image: url(img/drip0.svg); background-position: -140px 0; }
  .deco--love::after { left: calc(129.9px - 2px - 4px); top: calc(34.0px - 2px - 6px); animation-delay: 4.8s; }
  .deco--spark::before { background-image: url(img/drip1.svg); background-position: 40px 0; }
  .deco--spark::after { left: calc(176.3px - 2px - 4px); top: calc(26.1px - 2px - 6px); animation-delay: 6.4s; }
  .deco--gift::before { background-image: url(img/drip2.svg); background-position: -90px 0; }
  .deco--gift::after { left: calc(153.1px - 2px - 4px); top: calc(30.3px - 2px - 6px); animation-delay: 8.0s; }
  .deco > :not(.deco__i):not(.deco__rise) { position: relative; z-index: 1; }
  .deco__i { position: absolute; z-index: 1; display: block; pointer-events: none; color: var(--rose); filter: drop-shadow(0 2px 3px rgba(150,70,95,.25)); animation: deco-bob 3s ease-in-out infinite; }
  .deco__i svg { display: block; width: 100%; height: 100%; }
  .deco__i.w { color: var(--white); filter: drop-shadow(0 1px 4px rgba(224,116,150,.7)); }
  .deco__i.p1 { left: -12px; top: -16px; width: 34px; height: 34px; animation-duration: 2.8s; }
  .deco__i.p2 { right: 18%; top: -14px; width: 24px; height: 24px; animation-duration: 3.4s; animation-delay: -1.2s; }
  .deco__i.p3 { right: -12px; top: 34%; width: 28px; height: 28px; animation-duration: 3.1s; animation-delay: -.6s; }
  .deco__i.p4 { left: -10px; bottom: 22%; width: 22px; height: 22px; animation-duration: 2.6s; animation-delay: -1.8s; }
  .deco__i.p5 { right: -8px; bottom: -14px; width: 32px; height: 32px; animation-duration: 3.6s; animation-delay: -.9s; }
  .deco__i.p6 { left: 30%; bottom: -12px; width: 20px; height: 20px; animation-duration: 2.9s; animation-delay: -2.2s; }
  @keyframes deco-bob {
    0%, 100% { transform: translateY(0) rotate(-10deg); }
    50%      { transform: translateY(-7px) rotate(10deg); }
  }
  .deco__rise { position: absolute; z-index: 1; bottom: 12px; width: 18px; height: 18px; pointer-events: none; color: var(--rose); opacity: 0; animation: deco-rise 4.2s ease-in infinite; }
  .deco__rise svg { display: block; width: 100%; height: 100%; }
  .deco__rise.r1 { right: 16%; animation-delay: .4s; }
  .deco__rise.r2 { right: 34%; width: 14px; height: 14px; animation-delay: 2.2s; color: var(--white); }
  .deco__rise.r3 { right: 6%; width: 16px; height: 16px; animation-delay: 3.3s; }
  @keyframes deco-rise {
    0%   { opacity: 0; transform: translate(0, 0) rotate(-12deg) scale(.7); }
    15%  { opacity: .9; }
    50%  { transform: translate(8px, -60px) rotate(10deg) scale(1); }
    85%  { opacity: .6; }
    100% { opacity: 0; transform: translate(-6px, -120px) rotate(-8deg) scale(.9); }
  }

  /* トップへ戻る */
  .totop { position: fixed; right: 16px; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); z-index: 80;
    display: grid; place-items: center; width: 52px; height: 52px; padding: 0; border-radius: 50%;
    background: var(--rose); color: var(--white); border: 2px solid var(--white); box-shadow: 0 6px 16px rgba(150,70,95,.3);
    cursor: pointer; opacity: 0; visibility: hidden; transform: translateY(16px) scale(.8);
    transition: opacity .25s, transform .35s cubic-bezier(.3,1.5,.5,1), visibility .25s; -webkit-tap-highlight-color: transparent; }
  .totop.is-show { opacity: 1; visibility: visible; transform: none; }
  .totop:active { transform: scale(.92); }
  .totop svg { width: 22px; height: 22px; }
  .totop small { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-family: var(--en); font-weight: 500; font-size: 9px; letter-spacing: .15em; color: var(--rose-deep); white-space: nowrap; }
  .tomenu { position: fixed; right: 16px; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); z-index: 80;
    display: grid; place-items: center; width: 52px; height: 52px; padding: 0; border-radius: 50%;
    background: var(--white); color: var(--rose); border: 2px solid var(--rose); box-shadow: 0 6px 16px rgba(150,70,95,.25);
    cursor: pointer; opacity: 0; visibility: hidden; transform: translateY(16px) scale(.8);
    transition: opacity .25s, transform .35s cubic-bezier(.3,1.5,.5,1) .05s, visibility .25s; -webkit-tap-highlight-color: transparent; }
  .tomenu.is-show { opacity: 1; visibility: visible; transform: none; }
  .tomenu:active { transform: scale(.92); }
  .tomenu svg { width: 22px; height: 22px; }
  .tomenu small { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-family: var(--en); font-weight: 500; font-size: 9px; letter-spacing: .15em; color: var(--rose-deep); white-space: nowrap; }
  body.menu-open .tomenu, body.menu-open .totop { opacity: 0; visibility: hidden; }

  /* 更新のお知らせ */
  .upd { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 90; transform: translate(-50%, 160%);
    display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 32px); white-space: nowrap; text-align: left; padding: 12px 18px 12px 16px;
    background: #E07496; color: #fff; border: 2px solid #fff; border-radius: 999px; box-shadow: 0 8px 22px rgba(150,70,95,.35);
    font-family: "Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans",sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .06em;
    cursor: pointer; transition: transform .45s cubic-bezier(.3,1.5,.5,1); -webkit-tap-highlight-color: transparent; }
  .upd.is-show { transform: translate(-50%, 0); }
  .upd small { display: block; font-weight: 500; font-size: 11px; opacity: .9; }
  .upd__dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: upd-blink 1.2s ease-in-out infinite; }
  @keyframes upd-blink { 50% { opacity: .3; transform: scale(.7); } }

  /* SONGS */
  .deco--songs::before { background-image: url(img/drip2.svg); background-position: -110px 0; }
  .deco--songs::after { left: calc(243.1px - 110px - 2px - 4px); top: calc(30.3px - 2px - 6px); animation-delay: 2.2s; }
  .songs__page-link { display:inline-block; margin-bottom:10px; font-size:12px; color:var(--ink-sub); border-bottom:1px solid rgba(142,92,105,.35); }
  .songs__credit { display:flex; flex-wrap:wrap; gap:4px 10px; }
  .songs__credit a { font-size:10px; padding:4px; color:var(--ink-sub); text-decoration:none; }
  .songs__credit a:hover { color:var(--rose-deep); text-decoration:underline; }
  .songs__modes { display:flex; gap:4px; padding:4px; border-radius:999px; background:rgba(255,255,255,.55); margin-bottom:8px; }
  .songs__modes button { flex:1; border:0; border-radius:999px; padding:8px 6px; background:transparent; color:var(--ink-sub); font:inherit; font-size:12px; cursor:pointer; }
  .songs__modes button[aria-pressed="true"] { background:var(--white); color:var(--rose-deep); box-shadow:0 2px 8px rgba(181,100,130,.12); }
  .songs__kana { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .songs__kana button { border:1px solid rgba(181,100,130,.2); border-radius:999px; padding:5px 9px; background:rgba(255,255,255,.65); color:var(--ink-sub); font:inherit; font-size:11px; cursor:pointer; }
  .songs__kana button[aria-pressed="true"] { background:var(--rose-deep); color:#fff; }
  .songs__tools { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px; }
  .songs__tools label { font-size:13px; color:var(--ink-sub); }
  .songs__tools select, .songs__random { max-width:100%; padding:9px 13px; border:1.5px solid var(--white); border-radius:999px; background:rgba(255,255,255,.8); color:var(--rose-deep); font:inherit; font-size:13px; }
  .songs__random:disabled { opacity:.5; }
  .songs__picked { margin-top:12px; padding:14px; border-radius:16px; background:rgba(255,255,255,.8); color:var(--ink); overflow-wrap:anywhere; }

  html.op .bubble { animation: none; opacity: 0; }
  .opening { position: fixed; top: 0; left: 0; right: 0; bottom: auto; height: calc(100vh + 160px); height: calc(100lvh + 160px); z-index: 100; overflow: hidden; background-color: #2A0F1A; cursor: pointer; transition: opacity .45s ease; animation: op-bg .8s ease 3.95s forwards; }
  @keyframes op-bg { to { background-color: rgba(42,15,26,0); } }

    position: absolute; top: 0; bottom: 0; width: 82vw; transform-origin: 50% 0;

      linear-gradient(180deg, rgba(255,255,255,.16), transparent 22%, transparent 78%, rgba(50,8,24,.55) 100%),

  /* 横の移動（なめらかに減速）と、裾の揺れ（振り子）を別々に動かす */

    animation: op-slide-l 3s cubic-bezier(.4,.05,.2,1) 3.9s forwards, op-swing-l 3.2s linear 3.9s forwards; }
  .op-r { right: -30vw; background-position: 0 0, 0 0;
