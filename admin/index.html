<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6E4E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="しぃ管理">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>しぃ管理</title>
<style>
  :root {
    --top:#F6E4E9; --mid:#ECCDD6; --low:#E2B9C6; --rose:#E07496;
    --ink:#5E3540; --sub:#8E5C69; --white:#fff; --rule:rgba(255,255,255,.7); --err:#B3264A;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    --maru:"Hiragino Maru Gothic ProN","Zen Maru Gothic",var(--sans);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:linear-gradient(180deg,var(--top),var(--mid) 60%,var(--low));background-color:var(--mid);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
  main{width:min(520px,100% - 40px);margin-inline:auto;padding-block:40px 64px}
  h1{font-family:var(--maru);font-weight:700;font-size:22px;letter-spacing:.08em;color:var(--rose)}
  h1 small{display:block;font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--sub);margin-top:2px}
  .card{margin-top:28px}
  label{display:block;font-family:var(--maru);font-weight:700;font-size:14px;letter-spacing:.08em;margin-bottom:8px}
  input{width:100%;height:52px;padding:0 14px;border:1.5px solid var(--rose);border-radius:10px;background:rgba(255,255,255,.92);font-size:16px;color:var(--ink);font-family:var(--sans)}
  input:focus{outline:2px solid var(--white);outline-offset:2px}
  .row{display:flex;gap:10px;margin-top:12px}
  button{font-family:var(--maru);font-weight:700;font-size:15px;letter-spacing:.1em;height:52px;border-radius:999px;cursor:pointer;border:1.5px solid var(--rose)}
  .primary{flex:1;background:var(--rose);color:var(--white);box-shadow:4px 4px 0 var(--white);transition:transform .12s,box-shadow .12s}
  .primary:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--white)}
  .primary:disabled{opacity:.5}
  .ghost{background:var(--white);color:var(--ink);padding:0 18px}
  .msg{margin-top:14px;min-height:1.7em;font-size:14px;font-weight:600}
  .msg.err{color:var(--err)}
  h2{margin-top:44px;font-family:var(--maru);font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--sub)}
  ul{list-style:none;margin-top:10px}
  li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:14px}
  li:first-child{border-top:1px solid var(--rule)}
  li a{color:var(--ink);word-break:break-all}
  li small{display:block;color:var(--sub);font-size:12px}
  .del{height:36px;padding:0 14px;font-size:13px;background:var(--white);color:var(--ink)}
  .empty{padding:14px 0;font-size:14px;color:var(--sub)}
  .foot{margin-top:40px;display:flex;justify-content:space-between;font-size:12px}
  .foot a,.foot button{color:var(--sub);background:none;border:0;height:auto;font:inherit;letter-spacing:.06em;text-decoration:underline;cursor:pointer}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>しぃ管理<small>サイトに載せる X のポスト</small></h1>

  <section id="keyView" class="card" hidden>
    <label for="key">合言葉を入れてください</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="xxxx-xxxx-xxxx-xxxx">
    <div class="row"><button class="primary" id="saveKey">はじめる</button></div>
    <p class="msg" id="keyMsg"></p>
  </section>

  <section id="mainView" hidden>
    <div class="card">
      <label for="url">載せたいポストのリンク</label>
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://x.com/…/status/…">
      <div class="row">
        <button class="ghost" id="paste" type="button">貼り付け</button>
        <button class="primary" id="add">載せる</button>
      </div>
      <p class="msg" id="msg"></p>
    </div>

    <h2>いま載っているポスト（上から表示・最大5件）</h2>
    <ul id="list"><li class="empty">読み込み中…</li></ul>

    <div class="foot">
      <a href="../" target="_blank" rel="noopener">サイトを見る</a>
      <button id="resetKey" type="button">合言葉を入れ直す</button>
    </div>
  </section>
</main>
<script>
(function(){
  var SB='https://uglxilcwbgqoofnzngux.supabase.co/rest/v1/rpc/', SBKEY='sb_publishable_R83zSq90hslRd5jl04sIPg_hZlLxfRC';
  var PASS='shii_admin_pass';
  var $=function(id){return document.getElementById(id);};
  var posts=[];
  function getPass(){ try{return localStorage.getItem(PASS)||'';}catch(e){return '';} }
  function setPass(v){ try{ v?localStorage.setItem(PASS,v):localStorage.removeItem(PASS); }catch(e){} }
  function say(el,text,err){ el.textContent=text; el.classList.toggle('err',!!err); }
  function call(body){
    body.p_pass=getPass();
    return fetch(SB+'shii_post_admin',{method:'POST',headers:{'apikey':SBKEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){return null;}).then(function(d){
        if(!r.ok) throw new Error(d&&(d.message==='auth'||d.message==='dup')?d.message:'net');
        return d; }); });
  }
  function fail(e){
    if(e.message==='auth'){ setPass(''); showKey('合言葉がちがうみたい。もう一度入れてね'); return; }
    say($('msg'), e.message==='dup'?'そのポストはもう載っています':'通信できなかったみたい。電波を確認してもう一度押してね', true);
  }
  function normalize(u){
    var m=String(u).trim().match(/^https?:\/\/(?:www\.|mobile\.)?(?:x|twitter)\.com\/([A-Za-z0-9_]+)\/status(?:es)?\/(\d+)/);
    return m ? 'https://x.com/'+m[1]+'/status/'+m[2] : null;
  }
  function render(){
    var ul=$('list'); ul.innerHTML='';
    if(!posts.length){ ul.innerHTML='<li class="empty">まだ何も載っていません</li>'; return; }
    posts.forEach(function(p,i){
      var li=document.createElement('li'), d=p.added?new Date(p.added):null;
      var left=document.createElement('div');
      var a=document.createElement('a'); a.href=p.url; a.target='_blank'; a.rel='noopener'; a.textContent=p.url.replace('https://x.com/','');
      var sm=document.createElement('small'); sm.textContent=(i<5?'表示中':'表示されていません')+(d?'・'+(d.getMonth()+1)+'/'+d.getDate()+'に追加':'');
      left.appendChild(a); left.appendChild(sm);
      var b=document.createElement('button'); b.className='del'; b.type='button'; b.textContent='消す';
      b.onclick=function(){ if(!confirm('このポストをサイトから外す？'))return; b.disabled=true;
        call({p_action:'delete',p_url:p.url}).then(function(d){ posts=d||[]; render(); say($('msg'),'外しました'); })
          .catch(function(e){ b.disabled=false; fail(e); });
      };
      li.appendChild(left); li.appendChild(b); ul.appendChild(li);
    });
  }
  function load(){
    return call({p_action:'list'}).then(function(d){ posts=d||[]; render(); })
      .catch(function(e){ $('list').innerHTML='<li class="empty">読み込めませんでした</li>'; fail(e); });
  }
  $('paste').onclick=function(){
    if(navigator.clipboard&&navigator.clipboard.readText){ navigator.clipboard.readText().then(function(t){ $('url').value=t.trim(); }).catch(function(){ say($('msg'),'長押しで貼り付けてね',true); }); }
    else say($('msg'),'長押しで貼り付けてね',true);
  };
  $('add').onclick=function(){
    var url=normalize($('url').value);
    if(!url){ say($('msg'),'Xのポストのリンクを貼ってね（…/status/… の形）',true); return; }
    var btn=$('add'); btn.disabled=true; say($('msg'),'載せています…');
    call({p_action:'add',p_url:url}).then(function(d){ posts=d||[]; $('url').value=''; render(); say($('msg'),'載せました！サイトにすぐ出ます'); })
      .catch(fail).then(function(){ btn.disabled=false; });
  };
  function start(){ $('keyView').hidden=true; $('mainView').hidden=false; load(); }
  function showKey(t){ $('mainView').hidden=true; $('keyView').hidden=false; say($('keyMsg'),t||'',!!t); }
  $('saveKey').onclick=function(){ var v=$('key').value.trim(); if(!v){ say($('keyMsg'),'合言葉が空っぽです',true); return; } setPass(v); $('key').value=''; start(); };
  $('key').addEventListener('keydown',function(e){ if(e.key==='Enter') $('saveKey').click(); });
  $('resetKey').onclick=function(){ setPass(''); showKey(''); };
  getPass() ? start() : showKey('');
})();
</script>
</body>
</html>
