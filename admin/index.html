<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6E4E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="しぃ管理">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>しぃ管理</title>
<style>
  :root {
    --sky-top:#F6E4E9; --sky:#ECCDD6; --lilac:#E2B9C6; --peri:#E07496;
    --ink:#5E3540; --sub:#8E5C69; --white:#fff; --rule:rgba(255,255,255,.7); --err:#B3264A;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    --maru:"Hiragino Maru Gothic ProN","Zen Maru Gothic",var(--sans);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:linear-gradient(180deg,var(--sky-top),var(--sky) 60%,var(--lilac));background-color:var(--sky);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
  main{width:min(520px,100% - 40px);margin-inline:auto;padding-block:40px 64px}
  h1{font-family:var(--maru);font-weight:700;font-size:22px;letter-spacing:.08em;color:var(--peri)}
  h1 small{display:block;font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--sub);margin-top:2px}
  .card{margin-top:28px}
  label{display:block;font-family:var(--maru);font-weight:700;font-size:14px;letter-spacing:.08em;margin-bottom:8px}
  input{width:100%;height:52px;padding:0 14px;border:1.5px solid var(--peri);border-radius:8px;background:rgba(255,255,255,.9);font-size:16px;color:var(--ink);font-family:var(--sans)}
  input:focus{outline:2px solid var(--white);outline-offset:2px}
  .row{display:flex;gap:10px;margin-top:12px}
  button{font-family:var(--maru);font-weight:700;font-size:15px;letter-spacing:.1em;height:52px;border-radius:8px;cursor:pointer;border:1.5px solid var(--peri)}
  .primary{flex:1;background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--peri);transition:transform .12s,box-shadow .12s}
  .primary:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--peri)}
  .primary:disabled{opacity:.5}
  .ghost{background:transparent;color:var(--ink);padding:0 16px}
  .msg{margin-top:14px;min-height:1.7em;font-size:14px;font-weight:600}
  .msg.err{color:var(--err)}
  h2{margin-top:44px;font-family:var(--maru);font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--sub)}
  ul{list-style:none;margin-top:10px}
  li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:14px}
  li:first-child{border-top:1px solid var(--rule)}
  li a{color:var(--ink);word-break:break-all}
  li small{display:block;color:var(--sub);font-size:12px}
  .del{height:36px;padding:0 14px;font-size:13px;background:transparent;color:var(--ink)}
  .empty{padding:14px 0;font-size:14px;color:var(--sub)}
  .foot{margin-top:40px;display:flex;justify-content:space-between;font-size:12px}
  .foot a,.foot button{color:var(--sub);background:none;border:0;height:auto;font:inherit;letter-spacing:.06em;text-decoration:underline;cursor:pointer}
  .tabs{display:flex;gap:8px;margin-top:24px}
  .tab{flex:1;height:44px;background:rgba(255,255,255,.35);color:var(--ink);font-size:14px;border-color:var(--rule)}
  .tab[aria-selected="true"]{background:var(--white);border-color:var(--peri);box-shadow:3px 3px 0 var(--peri)}
  .tab b{font-family:var(--sans);font-size:12px;margin-left:4px;color:var(--peri)}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding:14px 16px;border-radius:8px;background:rgba(255,255,255,.4);border:1.5px solid var(--rule);font-family:var(--maru);font-weight:700;font-size:14px;letter-spacing:.06em}
  .switch small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--sub);letter-spacing:.02em}
  .toggle{position:relative;flex:none;width:56px;height:32px;border-radius:16px;padding:0;background:rgba(94,53,64,.18);border:0;transition:background .15s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--white);box-shadow:0 1px 3px rgba(94,53,64,.3);transition:transform .15s}
  .toggle[aria-checked="true"]{background:var(--peri)}
  .toggle[aria-checked="true"]::after{transform:translateX(24px)}
  .toggle:disabled{opacity:.5}
  .rq{align-items:flex-start}
  .rq .t{font-family:var(--maru);font-weight:700;font-size:16px;letter-spacing:.04em;word-break:break-word}
  .rq .a{font-size:13px;color:var(--sub);margin-top:1px;word-break:break-word}
  .rq .c{margin-top:6px;font-size:13px;line-height:1.7;word-break:break-word}
  .rq .m{display:block;margin-top:6px;color:var(--sub);font-size:12px}
  .rq .acts{display:flex;flex-direction:column;gap:6px;flex:none}
  .rq .sung{height:36px;padding:0 12px;font-size:13px;background:var(--white);color:var(--ink)}
  .rq.is-done .t,.rq.is-done .a,.rq.is-done .c{opacity:.5}
  .rq.is-done .sung{background:transparent}
  .reload{margin-top:14px;height:auto;padding:0;border:0;background:none;font:inherit;font-size:12px;color:var(--sub);text-decoration:underline;cursor:pointer}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>しぃ管理<small>歌のリクエストと X のポスト</small></h1>

  <section id="keyView" class="card" hidden>
    <label for="key">合言葉を入れてください</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="xxxx-xxxx-xxxx-xxxx">
    <div class="row"><button class="primary" id="saveKey">はじめる</button></div>
    <p class="msg" id="keyMsg"></p>
  </section>

  <section id="mainView" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" id="tabReq" role="tab" aria-selected="true" type="button">リクエスト<b id="reqCount"></b></button>
      <button class="tab" id="tabPost" role="tab" aria-selected="false" type="button">X のポスト</button>
    </div>

    <div id="reqView">
      <div id="reqBody">
      <div class="switch">
        <div>リクエスト受付<small id="openText">読み込み中…</small></div>
        <button class="toggle" id="openToggle" role="switch" aria-checked="true" aria-label="リクエスト受付" type="button" disabled></button>
      </div>
      <p class="msg" id="reqMsg"></p>
      <h2 style="margin-top:20px">届いたリクエスト（新しい順）</h2>
      <ul id="reqList"><li class="empty">読み込み中…</li></ul>
      <button class="reload" id="reqReload" type="button">最新にする</button>
      </div>
    </div>

    <div id="postView" hidden>
    <div class="card">
      <label for="url">載せたいポストのリンク</label>
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://x.com/…/status/…">
      <div class="row">
        <button class="ghost" id="paste" type="button">貼り付け</button>
        <button class="primary" id="add">載せる</button>
      </div>
      <p class="msg" id="msg"></p>
    </div>

    <h2>いま載っているポスト（上から表示・最大5件）</h2>
    <ul id="list"><li class="empty">読み込み中…</li></ul>
    </div>

    <div class="foot">
      <a href="../" target="_blank" rel="noopener">サイトを見る</a>
      <button id="resetKey" type="button">合言葉を入れ直す</button>
    </div>
  </section>
</main>
<script>
(function(){
  var SB='https://uglxilcwbgqoofnzngux.supabase.co/rest/v1/rpc/', SBKEY='sb_publishable_R83zSq90hslRd5jl04sIPg_hZlLxfRC';
  var PASS='shii_admin_pass';
  var $=function(id){return document.getElementById(id);};
  var posts=[], req={items:[],open:true};

  function getPass(){ try{return localStorage.getItem(PASS)||'';}catch(e){return '';} }
  function setPass(v){ try{ v?localStorage.setItem(PASS,v):localStorage.removeItem(PASS);  }catch(e){} }
  function say(el,text,err){ el.textContent=text; el.classList.toggle('err',!!err); }
  function errText(e){ return e.message==='dup'?'そのポストはもう載っています':'通信できなかったみたい。電波を確認してもう一度押してね'; }
  function call(fn,body){
    body.p_pass=getPass();
    return fetch(SB+fn,{method:'POST',headers:{'apikey':SBKEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){return null;}).then(function(d){
        if(!r.ok) throw new Error(d&&(d.message==='auth'||d.message==='dup')?d.message:'net');
        return d; }); });
  }
  function fail(e,el){ if(e.message==='auth'){ setPass(''); showKey('合言葉がちがうみたい。もう一度入れてね'); return; } say(el,errText(e),true); }
  function normalize(u){
    var m=String(u).trim().match(/^https?:\/\/(?:www\.|mobile\.)?(?:x|twitter)\.com\/([A-Za-z0-9_]+)\/status(?:es)?\/(\d+)/);
    return m ? 'https://x.com/'+m[1]+'/status/'+m[2] : null;
  }
  function fmt(iso){ var d=new Date(iso); if(isNaN(d))return ''; return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2); }

  // ---- X のポスト ----
  function render(){
    var ul=$('list'); ul.innerHTML='';
    if(!posts.length){ ul.innerHTML='<li class="empty">まだ何も載っていません</li>'; return; }
    posts.forEach(function(p,i){
      var li=document.createElement('li');
      var d=p.added?new Date(p.added):null;
      var left=document.createElement('div');
      var a=document.createElement('a'); a.href=p.url; a.target='_blank'; a.rel='noopener'; a.textContent=p.url.replace('https://x.com/','');
      var sm=document.createElement('small'); sm.textContent=(i<5?'表示中':'表示されていません')+(d?'・'+(d.getMonth()+1)+'/'+d.getDate()+'に追加':'');
      left.appendChild(a); left.appendChild(sm);
      var b=document.createElement('button'); b.className='del'; b.textContent='消す';
      b.onclick=function(){ if(!confirm('このポストをサイトから外す？'))return; b.disabled=true;
        call('shii_post_admin',{p_action:'delete',p_url:p.url}).then(function(d){ posts=d||[]; render(); say($('msg'),'外しました'); })
          .catch(function(e){ b.disabled=false; fail(e,$('msg')); });
      };
      li.appendChild(left); li.appendChild(b); ul.appendChild(li);
    });
  }
  function loadPosts(){
    return call('shii_post_admin',{p_action:'list'}).then(function(d){ posts=d||[]; render(); })
      .catch(function(e){ $('list').innerHTML='<li class="empty">読み込めませんでした</li>'; fail(e,$('msg')); });
  }
  $('paste').onclick=function(){
    if(navigator.clipboard&&navigator.clipboard.readText){ navigator.clipboard.readText().then(function(t){ $('url').value=t.trim(); }).catch(function(){ say($('msg'),'長押しで貼り付けてね',true); }); }
    else say($('msg'),'長押しで貼り付けてね',true);
  };
  $('add').onclick=function(){
    var url=normalize($('url').value);
    if(!url){ say($('msg'),'Xのポストのリンクを貼ってね（…/status/… の形）',true); return; }
    var btn=$('add'); btn.disabled=true; say($('msg'),'載せています…');
    call('shii_post_admin',{p_action:'add',p_url:url}).then(function(d){ posts=d||[]; $('url').value=''; render(); say($('msg'),'載せました！サイトにすぐ出ます'); })
      .catch(function(e){ fail(e,$('msg')); })
      .then(function(){ btn.disabled=false; });
  };

  // ---- 歌のリクエスト ----
  function rcall(act,id,val){ return call('shii_req_admin',{p_action:act,p_id:id||null,p_value:(val===undefined?null:val)}); }
  function renderOpen(){
    var t=$('openToggle'); t.disabled=false; t.setAttribute('aria-checked',req.open?'true':'false');
    $('openText').textContent=req.open?'受付中（サイトから送れます）':'お休み中（サイトに「お休み中」と出ます）';
  }
  function renderReq(){
    var ul=$('reqList'); ul.innerHTML='';
    var rest=req.items.filter(function(x){return !x.done;}).length;
    $('reqCount').textContent=rest?String(rest):'';
    if(!req.items.length){ ul.innerHTML='<li class="empty">まだリクエストはありません</li>'; return; }
    var sorted=req.items.filter(function(x){return !x.done;}).concat(req.items.filter(function(x){return x.done;}));
    sorted.forEach(function(it){
      var li=document.createElement('li'); li.className='rq'+(it.done?' is-done':'');
      var left=document.createElement('div');
      var t=document.createElement('div'); t.className='t'; t.textContent=it.song; left.appendChild(t);
      if(it.artist){ var a=document.createElement('div'); a.className='a'; a.textContent=it.artist; left.appendChild(a); }
      if(it.comment){ var c=document.createElement('div'); c.className='c'; c.textContent=it.comment; left.appendChild(c); }
      var m=document.createElement('small'); m.className='m'; m.textContent=(it.name||'なまえなし')+'・'+fmt(it.at); left.appendChild(m);
      var acts=document.createElement('div'); acts.className='acts';
      var s=document.createElement('button'); s.className='sung'; s.type='button'; s.textContent=it.done?'もどす':'歌った✓';
      s.onclick=function(){ s.disabled=true;
        rcall('done',it.id,!it.done).then(function(){ it.done=!it.done; renderReq(); })
          .catch(function(e){ s.disabled=false; fail(e,$('reqMsg')); });
      };
      var d=document.createElement('button'); d.className='del'; d.type='button'; d.textContent='消す';
      d.onclick=function(){ if(!confirm('「'+it.song+'」のリクエストを消す？'))return; d.disabled=true;
        rcall('delete',it.id).then(function(){ req.items=req.items.filter(function(x){return x.id!==it.id;}); renderReq(); })
          .catch(function(e){ d.disabled=false; fail(e,$('reqMsg')); });
      };
      acts.appendChild(s); acts.appendChild(d);
      li.appendChild(left); li.appendChild(acts); ul.appendChild(li);
    });
  }
  function loadReq(){
    say($('reqMsg'),'');
    return rcall('list').then(function(d){ req.items=d.items||[]; req.open=d.open!==false; renderOpen(); renderReq(); })
      .catch(function(e){ $('reqList').innerHTML='<li class="empty">読み込めませんでした</li>'; $('openText').textContent=''; fail(e,$('reqMsg')); });
  }
  $('openToggle').onclick=function(){
    var t=$('openToggle'), next=!req.open; t.disabled=true;
    rcall('open',null,next).then(function(d){ req.open=d.open; renderOpen(); say($('reqMsg'),next?'受付を再開しました':'受付をお休みにしました'); })
      .catch(function(e){ t.disabled=false; fail(e,$('reqMsg')); });
  };
  $('reqReload').onclick=loadReq;

  function showTab(name){
    var r=name==='req';
    $('tabReq').setAttribute('aria-selected',r?'true':'false'); $('tabPost').setAttribute('aria-selected',r?'false':'true');
    $('reqView').hidden=!r; $('postView').hidden=r;
  }
  $('tabReq').onclick=function(){ showTab('req'); };
  $('tabPost').onclick=function(){ showTab('post'); };

  function start(){ $('keyView').hidden=true; $('mainView').hidden=false; showTab('req'); loadReq(); loadPosts(); }
  function showKey(t){ $('mainView').hidden=true; $('keyView').hidden=false; say($('keyMsg'),t||'',!!t); }
  $('saveKey').onclick=function(){ var v=$('key').value.trim(); if(!v){ say($('keyMsg'),'合言葉が空っぽです',true); return; } setPass(v); $('key').value=''; start(); };
  $('key').addEventListener('keydown',function(e){ if(e.key==='Enter') $('saveKey').click(); });
  $('resetKey').onclick=function(){ setPass(''); showKey(''); };

  getPass() ? start() : showKey('');
})();
</script>
</body>
</html>
